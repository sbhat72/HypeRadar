spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis
spring.data.redis.url=${REDIS_URL}

# Clerk — JWKS URI and issuer are public endpoints, safe to embed as defaults
clerk.jwks-uri=${CLERK_JWKS_URI:https://coherent-doberman-64.clerk.accounts.dev/.well-known/jwks.json}
clerk.issuer=${CLERK_ISSUER:https://coherent-doberman-64.clerk.accounts.dev}


alphavantage.api-key=${ALPHA_VANTAGE_API_KEY}
alphavantage.base-url=https://www.alphavantage.co/query

# Reddit


# Resend
resend.api-key=${RESEND_API_KEY:placeholder}

# Scheduling
spring.task.scheduling.enabled=true


reddit.user-agent=java:HypeRadar:1.0 (by /u/sbhat72)
reddit.subreddits=wallstreetbets,stocks,investing

rss.feed.reuters=https://feeds.reuters.com/reuters/businessNews
rss.feed.cnbc=https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10001147
rss.feed.marketwatch=https://feeds.marketwatch.com/marketwatch/topstories/
rss.feed.nasdaq=https://www.nasdaq.com/feed/rssoutbound?category=stocks



